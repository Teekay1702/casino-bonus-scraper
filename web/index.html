<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casino Bonus Comparison</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Casino Bonus Comparison</h1>
    <p id="meta" class="meta"></p>
    <div id="status" role="status">Loading bonuses…</div>
    <div class="table-wrap" id="table-wrap" hidden>
      <table>
        <thead>
          <tr>
            <th scope="col">Casino</th>
            <th scope="col">Bonus offer</th>
            <th scope="col">Max bonus</th>
            <th scope="col">Wagering requirement</th>
            <th scope="col">Source</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script src="app.js"></script>
</body>

</html>
